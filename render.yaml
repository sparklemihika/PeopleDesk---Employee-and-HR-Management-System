# Render Blueprint: New + > Blueprint, pick this repo. Secrets marked sync:false are
# prompted for in the dashboard and are never stored in Git.
services:
  - type: web
    name: peopledesk
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false        # MongoDB Atlas connection string
      - key: CLIENT_ORIGIN
        sync: false        # e.g. https://peopledesk.onrender.com
      - key: APP_URL
        sync: false        # same value as CLIENT_ORIGIN
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
